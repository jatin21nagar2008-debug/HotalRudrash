<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Hotel Rudraaksh Palace</title>
    <script>
      // Single Page Apps for GitHub Pages redirection script
      // Converts any direct 404 path back into the hash route on the SPA
      var pathSegmentsToKeep = 1; // 1 for repo name /HotalRudrash/
      var l = window.location;
      var redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var searchAndHash = (l.search ? l.search : '') + (l.hash ? l.hash : '');
      var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#/' +
        redirectPath + searchAndHash;
      window.location.replace(targetUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to Hotel Rudraaksh Palace...</p>
  </body>
</html>
